    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Early Theme Initializer to prevent light/dark flash on reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('promptvault_theme');
          var isLight = saved === 'light';
          if (isLight) {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#6D3DF5');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Early Typography Initializer to prevent layout / font shift on reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('promptvault_typography');
          if (saved) {
            var parsed = JSON.parse(saved);
            var fontMap = {
              'Inter': "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
              'Plus Jakarta Sans': "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
              'SF Pro Display': "'SF Pro Display', -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif",
              'Poppins': "'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
              'Roboto': "'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
            };
            var stack = fontMap[parsed.fontFamily] || fontMap['Inter'];
            var size = parsed.fontSize ? parsed.fontSize + 'px' : '16px';
            document.documentElement.style.setProperty('--app-font-family', stack);
            document.documentElement.style.setProperty('--app-font-size', size);
            document.documentElement.style.fontSize = size;
            document.documentElement.style.fontFamily = stack;
            document.documentElement.setAttribute('data-font', (parsed.fontFamily || 'inter').toLowerCase().replace(/\s+/g, '-'));
            document.documentElement.setAttribute('data-font-size', String(parsed.fontSize || 16));
          }
        } catch (e) {}
      })();
    </script>

    <!-- Early BeforeInstallPrompt capture script to ensure event is never missed -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
