<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>PromptVault — AI Prompt Manager & Security Vault</title>
    <meta name="description" content="Simpan, kelola, organisir, dan cari prompt AI beserta screenshot referensi dengan enkripsi Access Key & sinkronisasi cloud realtime." />

    <!-- Web App Manifest for Android PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- Mobile & Android Theme Styling -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PromptVault" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Early Theme Initializer to prevent light/dark flash on reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('promptvault_theme');
          var isLight = saved === 'light';
          if (isLight) {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#6D3DF5');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Early BeforeInstallPrompt capture script to ensure event is never missed -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
    <script type="module" crossorigin src="./assets/index-DZoKDpxm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BoURpSfe.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
